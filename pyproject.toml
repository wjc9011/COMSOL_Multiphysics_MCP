[project]
name = "comsol-mcp"
dynamic = ["version"]
description = "A safety-focused MCP server for reproducible, provenance-bound COMSOL Multiphysics 6.4 automation and evidence workflows."
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    # The MCP server lane tracks only the newest stable SDK minor line. MCP 1.x
    # clients stay supported through the ordinary-tool wire path; that is a
    # client-compatibility requirement, not a second server dependency lane.
    "mcp>=2.2.0,<2.3",
    "matplotlib>=3.9,<4.0",
    # Two reviewed MPh lanes: the retained 1.3.1 reference lane and the 1.4.x
    # line. Add a third lane only with an explicit recorded decision.
    "mph>=1.3.1,<1.5",
    "numpy>=2.0,<3.0",
    "pydantic>=2.0.0,<3",
    "psutil>=5.9.0,<8",
    "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
manuals = [
    "pymupdf>=1.24.0,<2",
]
semantic-docs = [
    "numpy>=2.0,<3.0",
    "sentence-transformers>=3.4,<4",
]
dev = [
    "build>=1.2.0",
    "coverage>=7.15,<8",
    "hypothesis>=6.156,<7",
    "mypy>=2.3,<3",
    "packaging>=24,<27",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8,<4",
    "pyyaml>=6,<7",
    "ruff>=0.15,<1",
]

[project.scripts]
comsol-mcp = "comsol_mcp.server:main"
comsol-mcp-settings = "settings_gui.__main__:main"

[project.gui-scripts]
comsol-mcp-settings-gui = "settings_gui.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "comsol_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["comsol_mcp", "settings_gui"]
exclude = [
    "/settings_gui/tests",
    "/settings_gui/locales/**/*.po",
    "/settings_gui/locales/*.pot",
]

[tool.hatch.build.targets.wheel.force-include]
"settings.json" = "comsol_mcp/settings.json"

[tool.hatch.build.targets.sdist]
exclude = ["/development_kit", "/.claude", "/dsh_bridge"]

[tool.pytest.ini_options]
testpaths = ["development_kit/tests"]
# pytest-asyncio >= 1.4.1 deprecates the unset fixture loop scope at
# configure time; under -W error (the GUI gates) that warning killed the
# session before collection. Pin today's actual default explicitly so the
# behavior is identical on every pytest-asyncio version.
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: launches a real COMSOL probe in a dedicated subprocess",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally exercise security-sensitive shapes: wildcard listener
# fixtures (S104), password-like fixture labels (S105/S106), partial-path
# executables in release tooling assertions (S607), bare asserts (S101), and
# list-argv subprocess calls (S603).
"development_kit/tests/*.py" = ["S101", "S104", "S105", "S106", "S603", "S607"]
"settings_gui/tests/*.py" = ["S101", "S603"]
# Repository-only scripts and licensed acceptance probes bootstrap sys.path
# before imports and drive subprocess gates directly; they never ship in a
# wheel, and their best-effort cleanup swallows are deliberate.
"development_kit/scripts/*.py" = ["E402", "S603", "S607"]
"development_kit/tests/integration/*.py" = ["E402", "S110", "S112"]
"development_kit/tests/integration/probes/*.py" = ["E402"]
